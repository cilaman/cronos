        <h1>Cronos — Internal project management for ULTC</h1>
        <p>Cronos is an internal project management tool used by the ULTC team to plan, assign, and automate software development work using AI coding agents.</p>
        <h2>What is Cronos?</h2>
        <p>Cronos provides a Kanban-style task board where team members create and organize development tasks. Each task can be handed off to a Claude Code AI agent that autonomously writes code, runs tests, and opens pull requests — reducing the manual overhead of routine engineering work.</p>
        <h2>Who is it for?</h2>
        <p>Cronos is an internal tool operated by ULTC for its own engineering team. Access is restricted to authorized team members. It is not a public SaaS product.</p>
        <h2>How does it work?</h2>
        <p>Team members add tasks to the board with a title and a brief description of the desired outcome. The system queues the task and dispatches it to a Claude Code agent running in an isolated workspace. The agent reads the codebase, makes the requested changes, and reports back with results. Progress is visible in real time on the board.</p>
        <h2>Technology</h2>
        <p>Cronos is a web application built with React and FastAPI, deployed on a private VPS. It integrates with the Anthropic Claude API to power agent execution. All data is stored on the operator's own infrastructure.</p>
