<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <g transform="translate(140 140)">
    <!-- static rings -->
    <circle r="100" fill="none" stroke="#3B4757" stroke-width="22"/>
    <circle r="68" fill="none" stroke="#56657A" stroke-width="14"/>
    <circle r="42" fill="none" stroke="#A6FF2E" stroke-width="9"/>

    <!-- rotating anchor nodes (the harnessed orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="-100" r="10" fill="#A6FF2E"/>
      <circle cx="87" cy="50" r="10" fill="#A6FF2E"/>
      <circle cx="-87" cy="50" r="10" fill="#A6FF2E"/>
    </g>

    <!-- pulsing core (the active agent) -->
    <circle r="18" fill="#A6FF2E">
      <animate attributeName="r" values="18;21;18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.78;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
