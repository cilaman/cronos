$schema: "http://json-schema.org/draft-07/schema#"
title: delivery/v1 Workflow Spec
type: object
required:
  - apiVersion
  - metadata
  - nodes
  - edges
additionalProperties: false
properties:
  apiVersion:
    type: string
    const: "delivery/v1"
  metadata:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      description:
        type: string
    additionalProperties: false
  defaults:
    type: object
    properties:
      models:
        type: object
        properties:
          reasoning:
            type: string
          build:
            type: string
          recon:
            type: string
        additionalProperties: true
      budget:
        type: object
        required:
          - usd_ceiling
        properties:
          usd_ceiling:
            type: number
            minimum: 0
          on_exceed:
            type: string
            enum:
              - escalate
              - fail
        additionalProperties: false
    additionalProperties: false
  nodes:
    type: array
    minItems: 1
    items:
      oneOf:
        - $ref: "#/definitions/AgentNode"
        - $ref: "#/definitions/GateNode"
        - $ref: "#/definitions/ExecNode"
        - $ref: "#/definitions/HumanNode"
  edges:
    type: array
    items:
      $ref: "#/definitions/Edge"
  traceability:
    type: object
    properties:
      require:
        type: array
        items:
          type: string
      artifact:
        type: string
    additionalProperties: false

definitions:
  AgentNode:
    type: object
    required:
      - id
      - kind
      - agent
      - produces
    properties:
      id:
        type: string
      kind:
        type: string
        const: agent
      agent:
        type: string
      model:
        type: object
        properties:
          use:
            type: string
        additionalProperties: false
      tools:
        type: array
        items:
          type: string
      inputs:
        type: object
        properties:
          from:
            type: array
            items:
              type: string
        additionalProperties: false
      produces:
        type: object
        required:
          - class
        properties:
          class:
            type: string
        additionalProperties: false
      budget:
        type: object
        properties:
          usd_ceiling:
            type: number
            minimum: 0
        additionalProperties: false
      recon:
        type: boolean
      loop:
        $ref: "#/definitions/LoopConfig"
    additionalProperties: false

  GateNode:
    type: object
    required:
      - id
      - kind
      - checks
    properties:
      id:
        type: string
      kind:
        type: string
        const: gate
      checks:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - schema
                - traceability
                - acceptance
                - build
                - lint
                - types
                - test
                - diff_vs_acceptance
                - custom
                - security
            of:
              type: string
            scanners:
              type: object
              additionalProperties:
                type: string
            fail_on:
              type: array
              items:
                type: string
            on_missing_scanner:
              type: string
              enum:
                - skip
                - fail
            reconcile:
              type: boolean
          additionalProperties: false
      on_fail:
        type: string
        enum:
          - block
          - retry_upstream
      loop:
        $ref: "#/definitions/LoopConfig"
    additionalProperties: false

  ExecNode:
    type: object
    required:
      - id
      - kind
      - command
    properties:
      id:
        type: string
      kind:
        type: string
        const: exec
      command:
        type: string
      timeout:
        type: integer
        minimum: 1
      fail_on_nonzero:
        type: boolean
      produces:
        type: object
        required:
          - class
        properties:
          class:
            type: string
        additionalProperties: false
      loop:
        $ref: "#/definitions/LoopConfig"
    additionalProperties: false

  HumanNode:
    type: object
    required:
      - id
      - kind
      - prompt
    properties:
      id:
        type: string
      kind:
        type: string
        const: human
      prompt:
        type: string
    additionalProperties: false

  LoopConfig:
    type: object
    required:
      - until
    properties:
      until:
        type: string
      stall:
        type: array
        items:
          type: string
      max:
        type: integer
        minimum: 1
      on_exhaust:
        type: string
        enum:
          - escalate
          - fail
    additionalProperties: false

  Edge:
    type: object
    required:
      - from
      - to
    properties:
      from:
        type: string
      to:
        type: string
      when:
        type: string
    additionalProperties: false
