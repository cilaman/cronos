# Schema: review-class artifact YAML header (CC-v1)
# Class: review
# Phase identifier: review
# Artifact path: {space}/.cronos/pipeline/{goal_slug}/review-report-{goal_slug}.md
#
# Validation: python -m delivery_workflow.lib.verify --agent review --slug <slug> --space <space>
#
# Cronos deviations from Delivery Notes v1.0 (review-class):
#   - cc_version + phase are new base-header fields
#   - kb_hits removed (memory_hits optional)
#   - duration_s / token_spend are trace-owned; agents MUST NOT write them
#   - findings_addressed / files_modified (python-fixer fields) removed;
#     Cronos does not have a separate fixer agent — the reviewer produces a single
#     verdict and findings list

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "review.schema.yaml"
title: "Review-Class Artifact YAML Header (CC-v1)"
description: "Strict schema for review-class pipeline artifacts — code review verdict and structured findings."
type: object
additionalProperties: false

required:
  - cc_version
  - agent
  - slug
  - phase
  - status
  - confidence
  - inputs_used
  - outputs_produced
  - blockers
  - next_consumer
  - metrics
  - verdict
  - findings

properties:

  cc_version:
    type: string
    const: "1.0"

  agent:
    type: string
    minLength: 1
    description: "Agent name from the pipeline registry (e.g. 'reviewer')."

  slug:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*(--[a-z0-9]+(-[a-z0-9]+)*)?$"
    maxLength: 120

  phase:
    type: string
    const: "review"

  status:
    type: string
    enum: ["done", "partial", "blocked", "failed"]

  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0

  inputs_used:
    type: array
    items:
      type: string
      pattern: "^(?![/\\\\])(?![A-Za-z]:).*$"
    description: "Reviewed files (workspace-relative). Typically the files from the implementation's files_changed list."

  outputs_produced:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^(?![/\\\\])(?![A-Za-z]:).*$"

  blockers:
    type: array
    items:
      type: object
      required: [description, severity]
      properties:
        description: { type: string, minLength: 1 }
        severity: { type: string, enum: ["low", "medium", "high", "critical"] }
        suggested_resolution: { type: string }

  next_consumer:
    type: string
    minLength: 1
    description: "Typically 'doc' on PASS, or 'user' for manual resolution on FAIL."

  # --- review-class specific fields ---

  verdict:
    type: string
    enum: ["pass", "fail", "needs_fix"]
    description: "Machine-readable verdict for phase transition. R-rev-4: pass is incoherent with any finding where blocking=true."

  findings:
    type: array
    description: "Structured review findings. Empty list with verdict=pass is valid."
    items:
      type: object
      required: [id, severity, file, evidence, blocking, suggested_action]
      properties:
        id:
          type: string
          pattern: "^F[0-9]+$"
          description: "Stable finding identifier (F1, F2, …). Unique within this report."
        severity:
          type: string
          enum: ["critical", "high", "medium", "low"]
        file:
          type: string
          description: "Workspace-relative path with optional line reference (file.py:42)."
        evidence:
          type: string
          maxLength: 500
          description: "Code snippet or trace that shows the issue."
        blocking:
          type: boolean
          description: "Whether this finding alone fails the review. R-rev-4: any blocking=true requires verdict != pass."
        suggested_action:
          type: string
          description: "Concrete remediation step."

  attempt:
    type: integer
    minimum: 1
    description: "Review attempt counter (1, 2, …). Set by orchestrator, not derived by the agent."

  metrics:
    type: object
    required: [tool_calls, files_read]
    additionalProperties: true
    properties:
      tool_calls: { type: integer, minimum: 1 }
      files_read: { type: integer, minimum: 0 }
      memory_hits: { type: integer, minimum: 0 }
      diff_lines_reviewed:
        type: integer
        minimum: 0
        description: "Total diff lines inspected during this review."

# Cross-field rules enforced by verifier.py:
#
# R1: Non-empty blockers requires status in {blocked, failed}.
# R2: status=done requires confidence >= 0.7.
# R3: confidence in [0.0, 1.0].
# R4: metrics.files_read + metrics.memory_hits >= len(inputs_used).
# R5: outputs_produced[0] matches canonical path (warning).
# R6: slug verbatim from orchestrator.
# R7: workspace-relative forward-slash paths only.
#
# Review-class extensions (R-rev):
#   R-rev-1: verdict in {pass, fail, needs_fix}.
#   R-rev-2: finding.id matches ^F[0-9]+$.
#   R-rev-3: finding.id values are unique within this report.
#   R-rev-4: verdict=pass implies no finding with blocking=true.
#   R-rev-5: any finding with blocking=true implies verdict != pass.
#   R-rev-6: finding.severity in {critical, high, medium, low}.
#
# Required markdown sections:
#   ## Summary, ## Findings, ## Verdict, ## Assumptions,
#   ## Open questions, ## Next consumer brief
