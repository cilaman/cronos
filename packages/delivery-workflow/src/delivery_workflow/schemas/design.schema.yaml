$schema: "http://json-schema.org/draft-07/schema#"
title: delivery/v1 Design-Class Delivery Status Block
description: >
  Schema for the delivery_status fenced-block emitted by architect agents.
  Captures the design artifact routing surface (iterations plan, risk summary).
type: object
required:
  - status
  - artifact_paths
  - produces
  - fields
  - telemetry
additionalProperties: false
properties:
  status:
    type: string
    enum: [done, blocked, needs_fix, failed]
  artifact_paths:
    type: array
    items:
      type: string
  produces:
    type: string
    const: design
  fields:
    type: object
    additionalProperties: true
    properties:
      iterations_planned:
        type: integer
        minimum: 1
        description: Number of iterations[] entries in the design DAG.
      risks_count:
        type: integer
        minimum: 0
        description: Number of risks[] entries in the design report.
      dd_ids:
        type: array
        items:
          type: string
        description: Design decision IDs (DD-NNN) produced for traceability.
      has_ui:
        type: boolean
        description: Forwarded from analysis; gates the frontend-designer node.
  open_questions:
    type: array
    items:
      type: string
  telemetry:
    type: object
    required: [tokens, usd, seconds]
    additionalProperties: false
    properties:
      tokens:
        type: integer
        minimum: 0
      usd:
        type: number
        minimum: 0
      seconds:
        type: number
        minimum: 0
