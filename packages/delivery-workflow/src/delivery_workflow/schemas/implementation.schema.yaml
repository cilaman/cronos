$schema: "http://json-schema.org/draft-07/schema#"
title: delivery/v1 Implementation-Class Delivery Status Block
description: >
  Schema for the delivery_status fenced-block emitted by implementor agents.
  Fields surface iteration identity and changed-file metadata.
type: object
required:
  - status
  - artifact_paths
  - produces
  - fields
  - telemetry
additionalProperties: false
properties:
  status:
    type: string
    enum: [done, blocked, needs_fix, failed]
  artifact_paths:
    type: array
    items:
      type: string
  produces:
    type: string
    const: implementation
  fields:
    type: object
    additionalProperties: true
    properties:
      iteration_id:
        type: string
        pattern: "^I[0-9]+$"
        description: Uppercase iteration ID (e.g. I1, I4) matching design iterations[].
      files_changed:
        type: array
        items:
          type: string
        description: Workspace-relative paths modified by this iteration.
      validation_command_passed:
        type: boolean
        description: Whether the iteration's validation_command exited 0.
      diff_lines_added:
        type: integer
        minimum: 0
      diff_lines_removed:
        type: integer
        minimum: 0
  open_questions:
    type: array
    items:
      type: string
  telemetry:
    type: object
    required: [tokens, usd, seconds]
    additionalProperties: false
    properties:
      tokens:
        type: integer
        minimum: 0
      usd:
        type: number
        minimum: 0
      seconds:
        type: number
        minimum: 0
