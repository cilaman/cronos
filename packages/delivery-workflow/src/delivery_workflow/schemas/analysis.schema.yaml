$schema: "http://json-schema.org/draft-07/schema#"
title: delivery/v1 Analysis-Class Delivery Status Block
description: >
  Schema for the delivery_status fenced-block emitted by analyst agents.
  The 'has_ui' field is the primary routing surface (evalCondition reads it to branch
  to the frontend-designer node).
type: object
required:
  - status
  - artifact_paths
  - produces
  - fields
  - telemetry
additionalProperties: false
properties:
  status:
    type: string
    enum: [done, blocked, needs_fix, failed]
  artifact_paths:
    type: array
    items:
      type: string
  produces:
    type: string
    const: analysis
  fields:
    type: object
    required:
      - has_ui
    additionalProperties: true
    properties:
      has_ui:
        type: boolean
        description: Whether the feature requires frontend/UI work. Primary routing field.
      scope:
        type: string
        description: Human-readable summary of the analysis scope.
      requirements:
        type: array
        items:
          type: object
        description: Structured requirements list.
      req_ids:
        type: array
        items:
          type: string
        description: REQ-ids covered by this analysis (traceability anchors).
      acceptance_criteria_count:
        type: integer
        minimum: 0
  open_questions:
    type: array
    items:
      type: string
  telemetry:
    type: object
    required: [tokens, usd, seconds]
    additionalProperties: false
    properties:
      tokens:
        type: integer
        minimum: 0
      usd:
        type: number
        minimum: 0
      seconds:
        type: number
        minimum: 0
