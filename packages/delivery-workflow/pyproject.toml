[project]
name = "delivery-workflow"
version = "0.1.0"
description = "Portable delivery/v1 workflow executor library"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# R10a src layout: the importable distribution is src/delivery_workflow/.
# Hatchling ships every file under the package directory, so the data assets
# (delivery.workflow.yaml, schemas/, agents/, skills/, lib/schemas/) travel
# with the wheel and resolve via Path(__file__) anchors (e.g. verify.SCHEMAS_DIR).
[tool.hatch.build.targets.wheel]
packages = ["src/delivery_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["delivery_workflow"]
# Required whenever forbidden_modules name external packages (app/backend are
# not importable here); without it import-linter hard-errors before checking.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "No app.* imports anywhere in the delivery-workflow package"
type = "forbidden"
source_modules = ["delivery_workflow"]
forbidden_modules = ["app", "backend"]
