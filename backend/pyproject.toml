[project]
name = "cronos"
version = "0.0.1"
description = "Kanban-style task manager for orchestrating Claude Code agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-frontmatter>=1.1",
    "watchfiles>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
