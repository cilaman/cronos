[project]
name = "cronos"
version = "0.0.1"
description = "Kanban-style task manager for orchestrating Claude Code agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-frontmatter>=1.1",
    "watchfiles>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "croniter>=1.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-json-report",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
# debt: G02 ruff baseline — violations present in existing codebase; tracked here so G13 can prune
ignore = [
    "E501",  # line too long (120+ char lines exist in multiline strings and SQL)
    "E402",  # module level import not at top of file (conditional imports in __init__ and main)
    "F401",  # imported but unused (re-exports and TYPE_CHECKING blocks)
    "F541",  # f-string without placeholders
    "F821",  # undefined name (dynamic attribute access patterns)
    "F841",  # local variable assigned but never used
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

# debt: G02 mypy baseline — per-module ignore_errors until G13 hardens the type coverage
[[tool.mypy.overrides]]
module = "app.api.discovery"
ignore_errors = true  # debt: G02 mypy baseline

[[tool.mypy.overrides]]
module = "app.api.features"
ignore_errors = true  # debt: G02 mypy baseline

