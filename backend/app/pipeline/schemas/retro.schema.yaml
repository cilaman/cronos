# Schema: retro-class artifact YAML header (CC-v1)
# Class: retro
# Phase identifier: retro
# Artifact path: {space}/.cronos/pipeline/{goal_slug}/retro-{goal_slug}.md
#
# Validation: python -m app.pipeline.verify --agent retro --slug <slug> --space <space>
#
# Cronos extension over the upstream contract (no Delivery Notes precedent):
#   - Retro is the terminal self-improvement phase that runs after a pipeline
#     goal finalises. It reads every child task's run trace, pipeline-state.json
#     and per-phase verifier outputs, scores the run on the five evaluate-run
#     dimensions, and emits structured findings classified by fix-type.
#   - The fix_type classification is the load-bearing field: it routes each
#     improvement into one of four downstream channels — normalize rule,
#     verifier rule or schema field, agent-prompt refinement, or contract
#     change. Tasks 4.2 (known-issues store), 4.3 (memory write-back) and
#     4.4 (auto-improvement applier) consume fix_type to dispatch correctly.
#   - duration_s / token_spend stay trace-owned; agents MUST NOT write them.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "retro.schema.yaml"
title: "Retro-Class Artifact YAML Header (CC-v1)"
description: "Strict schema for retro-class pipeline artifacts — post-goal retrospective with evaluate-run scores and fix-type-classified findings."
type: object
additionalProperties: false

required:
  - cc_version
  - agent
  - slug
  - phase
  - status
  - confidence
  - inputs_used
  - outputs_produced
  - blockers
  - next_consumer
  - metrics
  - scores
  - findings

properties:

  cc_version:
    type: string
    const: "1.0"

  agent:
    type: string
    minLength: 1
    description: "Agent name from the pipeline registry (typically 'pipeline-retro')."

  slug:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*(--[a-z0-9]+(-[a-z0-9]+)*)?$"
    maxLength: 120

  phase:
    type: string
    const: "retro"

  status:
    type: string
    enum: ["done", "partial", "blocked", "failed"]

  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0

  inputs_used:
    type: array
    items:
      type: string
      pattern: "^(?![/\\\\])(?![A-Za-z]:).*$"
    description: "Per-phase artifacts read (scout/analysis/design/impl/test/review/doc reports), pipeline-state.json, phases-log.jsonl, and trace identifiers (e.g. 'trace:<task_id>:<run_index>')."

  outputs_produced:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^(?![/\\\\])(?![A-Za-z]:).*$"
    description: "Entry [0] is ALWAYS the retro artifact itself. Retro NEVER writes other files — outputs_produced has exactly one entry (R-retro-1)."

  blockers:
    type: array
    items:
      type: object
      required: [description, severity]
      properties:
        description: { type: string, minLength: 1 }
        severity: { type: string, enum: ["low", "medium", "high", "critical"] }
        suggested_resolution: { type: string }

  next_consumer:
    type: string
    minLength: 1
    description: "Typically 'user' (retrospective routes to human review) or, once task 4.4 lands, 'auto-improvement-applier' for machine application of fix-type-routed findings."

  # --- retro-class specific fields ---

  scores:
    type: object
    description: "Evaluate-run scoring rubric. Each dimension is a 1-5 integer matching the .claude/skills/evaluate-run scoring scale. R-retro-3: all five dimensions are required."
    additionalProperties: false
    required:
      - planning
      - error_handling
      - efficiency
      - completion
      - communication
    properties:
      planning:
        type: integer
        minimum: 1
        maximum: 5
        description: "Did agents explore before acting? (evaluate-run dimension 1.)"
      error_handling:
        type: integer
        minimum: 1
        maximum: 5
        description: "Did agents recover gracefully from failures? (evaluate-run dimension 2.)"
      efficiency:
        type: integer
        minimum: 1
        maximum: 5
        description: "Did agents avoid unnecessary work? (evaluate-run dimension 3.)"
      completion:
        type: integer
        minimum: 1
        maximum: 5
        description: "Did agents finish their phases correctly? (evaluate-run dimension 4.)"
      communication:
        type: integer
        minimum: 1
        maximum: 5
        description: "Did agents explain their reasoning clearly? (evaluate-run dimension 5.)"

  findings:
    type: array
    description: "Structured retrospective findings. Each finding MUST carry a fix_type classification (R-retro-2) routing it into one of the four self-improvement channels."
    items:
      type: object
      required: [id, severity, fix_type, target, evidence, suggested_action]
      properties:
        id:
          type: string
          pattern: "^F[0-9]+$"
          description: "Stable finding identifier (F1, F2, …). Unique within this report (R-retro-4)."
        severity:
          type: string
          enum: ["critical", "high", "medium", "low"]
        fix_type:
          type: string
          enum:
            - normalize_rule
            - verifier_rule_or_schema_field
            - agent_prompt_refinement
            - contract_change
          description: |
            Classification routing the finding into a self-improvement channel.
            normalize_rule:
              Mechanically fixable by app.pipeline.normalize (e.g. backslash paths,
              trailing whitespace in slugs, status=partial+blockers coerced to blocked).
              Consumed by task 4.4 (auto-improvement applier) to extend normalize_outputs.
            verifier_rule_or_schema_field:
              Missing a structural check or schema field that should have caught the
              issue at gate time. Adds a new R-* rule or per-class schema property.
            agent_prompt_refinement:
              Agent prompt is wrong, misleading, or incomplete; a prompt edit fixes
              the recurrence (.claude/agents/*.md change). Consumed by task 4.3
              (memory write-back) and task 4.4.
            contract_change:
              The CC-v1 contract itself needs to evolve (CONTRACT.md / contract.py),
              and a cc_version bump may be required. Consumed by task 4.6
              (contract versioning + changelog).
        target:
          type: string
          minLength: 1
          description: "Concrete artifact this finding addresses, e.g. 'agent:pipeline-architect', 'phase:design', 'rule:R-impl-3', 'normalize:status_partial_with_blockers', 'contract:CONTRACT.md#7.2'."
        evidence:
          type: string
          maxLength: 500
          description: "Trace excerpt, verifier error line, or artifact snippet that shows the issue."
        suggested_action:
          type: string
          minLength: 1
          description: "Concrete remediation routed by fix_type. Avoid 'consider X' — name the file/rule/field/section to change."
        known_issue_ref:
          type: string
          pattern: "^F-[0-9]+$"
          description: "Optional pointer to a known-issues catalog entry (F-NN), added once task 4.2 lands."

  metrics:
    type: object
    required: [tool_calls, files_read]
    additionalProperties: true
    properties:
      tool_calls: { type: integer, minimum: 1 }
      files_read: { type: integer, minimum: 0 }
      memory_hits: { type: integer, minimum: 0 }
      phases_reviewed:
        type: integer
        minimum: 0
        description: "Count of pipeline phases the retro inspected (i.e. unique keys in pipeline-state.json.phases)."
      traces_reviewed:
        type: integer
        minimum: 0
        description: "Count of run traces the retro read (typically one per child task)."

# Cross-field rules enforced by verifier.py:
#
# R1: Non-empty blockers requires status in {blocked, failed}.
# R2: status=done requires confidence >= 0.7.
# R3: confidence in [0.0, 1.0].
# R4: metrics.files_read + metrics.memory_hits >= len(inputs_used).
# R5: outputs_produced[0] matches canonical path (warning).
# R6: slug verbatim from orchestrator.
# R7: workspace-relative forward-slash paths only.
#
# Retro-class extensions (R-retro):
#   R-retro-1: outputs_produced has exactly one entry (the retro artifact).
#             Retro is a read-only phase; it never writes other files.
#   R-retro-2: every finding has a fix_type in the four-value enum
#             {normalize_rule, verifier_rule_or_schema_field,
#              agent_prompt_refinement, contract_change}.
#   R-retro-3: scores object has all five evaluate-run dimensions
#             (planning, error_handling, efficiency, completion, communication),
#             each an integer in [1, 5].
#   R-retro-4: finding.id matches ^F[0-9]+$ and is unique within findings[].
#
# Required markdown sections:
#   ## Summary, ## Scores, ## Findings, ## Assumptions,
#   ## Open questions, ## Next consumer brief
