# Local development stack. For production, layer
# `docker-compose.prod.yml` on top of this file.
#
# In dev, the Claude OAuth token (if you have one) can be passed via shell:
#   export CLAUDE_CODE_OAUTH_TOKEN=...
#   docker compose up --build
# Or by creating a `.env` file at the project root with the same key. Both
# are optional: the app boots without a token, and only agent runs will fail.

services:
  backend:
    build:
      context: ./backend
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
        BUILD_REPO_URL: ${BUILD_REPO_URL:-}
    environment:
      CRONOS_DATA_DIR: /data
      # Optional: PAT used to authenticate `git clone` for repo-linked spaces
      # over HTTPS. Single-user only — will be replaced by per-user storage
      # once Cronos supports multiple operators. Set in .env, never commit.
      CRONOS_GIT_TOKEN: ${CRONOS_GIT_TOKEN:-}
      # Application-layer HTTP Basic Auth. When both are set, the API requires
      # valid credentials on every request (except /api/health). Leave unset in
      # dev to disable auth. In production, prefer setting these in .env.
      CRONOS_BASIC_AUTH_USER: ${CRONOS_BASIC_AUTH_USER:-}
      CRONOS_BASIC_AUTH_PASSWORD: ${CRONOS_BASIC_AUTH_PASSWORD:-}
    # Pass-through: if CLAUDE_CODE_OAUTH_TOKEN is set in the shell or in a
    # project-root .env file, it lands in the container. Listing the bare
    # name (no value) means we *don't* clobber whatever the prod overlay
    # injects via env_file.
    env_file:
      - path: ./.env
        required: false
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Claude stores per-session conversation logs under /root/.claude.
      # A named volume keeps them across container restarts so `--resume` works.
      - claude_config:/root/.claude

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_COMMIT: ${BUILD_COMMIT:-}
        VITE_BUILD_TIME: ${BUILD_TIME:-}
        VITE_BUILD_REPO_URL: ${BUILD_REPO_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  claude_config:
