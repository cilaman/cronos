# Local development stack. For production, layer
# `docker-compose.prod.yml` on top of this file.
#
# In dev, the Claude OAuth token (if you have one) can be passed via shell:
#   export CLAUDE_CODE_OAUTH_TOKEN=...
#   docker compose up --build
# Or by creating a `.env` file at the project root with the same key. Both
# are optional: the app boots without a token, and only agent runs will fail.

services:
  backend:
    build:
      # Context is the repo root (not ./backend) so the image can also include
      # the sibling packages/delivery-workflow package the delivery/v2 runner
      # imports. See backend/Dockerfile (COPY sources are repo-root-relative).
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
        BUILD_REPO_URL: ${BUILD_REPO_URL:-}
    environment:
      CRONOS_DATA_DIR: /data
      # Optional: PAT used to authenticate `git clone` for repo-linked spaces
      # over HTTPS. Single-user only — will be replaced by per-user storage
      # once Cronos supports multiple operators. Set in .env, never commit.
      CRONOS_GIT_TOKEN: ${CRONOS_GIT_TOKEN:-}
      # Application-layer HTTP Basic Auth (fail-closed). The API requires valid
      # credentials on every request (except /api/health) when a username plus
      # EITHER a bcrypt hash (preferred — reuse BASIC_AUTH_HASH, no plaintext)
      # OR a plaintext password is set. To run without auth in dev, set
      # CRONOS_AUTH_DISABLED=true. In production, set these in .env.
      CRONOS_BASIC_AUTH_USER: ${CRONOS_BASIC_AUTH_USER:-}
      CRONOS_BASIC_AUTH_HASH: ${CRONOS_BASIC_AUTH_HASH:-}
      CRONOS_BASIC_AUTH_PASSWORD: ${CRONOS_BASIC_AUTH_PASSWORD:-}
      CRONOS_AUTH_DISABLED: ${CRONOS_AUTH_DISABLED:-}
      # Shared secret for agents calling the API from inside the container.
      # Agents send Authorization: Bearer <token> to bypass bcrypt. If unset,
      # the bypass is disabled (fail-closed). Generate: openssl rand -hex 32
      CRONOS_INTERNAL_TOKEN: ${CRONOS_INTERNAL_TOKEN:-}
      # Override worker.py's hardcoded /root/.claude/projects default so agent
      # run logs write to the cronos user's home instead of /root (unwritable).
      CLAUDE_PROJECTS_DIR: /home/cronos/.claude/projects
    # Pass-through: if CLAUDE_CODE_OAUTH_TOKEN is set in the shell or in a
    # project-root .env file, it lands in the container. Listing the bare
    # name (no value) means we *don't* clobber whatever the prod overlay
    # injects via env_file.
    env_file:
      - path: ./.env
        required: false
    expose:
      - "8000"
    restart: unless-stopped
    # Security hardening: drop all capabilities, then re-grant only what the
    # root entrypoint needs before it drops to the non-root cronos user:
    #   CHOWN + DAC_OVERRIDE  -> chown -R the /data bind-mount
    #   SETUID + SETGID       -> gosu drops root -> cronos
    # Without these, cap_drop:ALL makes the entrypoint die on the first chown
    # (set -e) and the backend never starts -> Caddy returns 502. The dropped
    # caps are the gate here, NOT no-new-privileges, which only blocks gaining
    # privileges via execve of setuid binaries and is kept on as defence in
    # depth (uvicorn still ends up unprivileged; gosu passes no caps to it).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
      # Claude stores per-session conversation logs under /home/cronos/.claude.
      # A named volume keeps them across container restarts so `--resume` works.
      - claude_config:/home/cronos/.claude

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BUILD_COMMIT: ${BUILD_COMMIT:-}
        VITE_BUILD_TIME: ${BUILD_TIME:-}
        VITE_BUILD_REPO_URL: ${BUILD_REPO_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
    # Security hardening: drop all capabilities but re-grant NET_BIND_SERVICE.
    # The container runs as root, but under cap_drop:ALL even root needs this
    # capability to bind the privileged ports 80/443 (Caddyfile unchanged).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  claude_config:
