name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" ruff mypy

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type-check (mypy)
        run: mypy app/

      - name: Test (pytest + coverage)
        run: pytest tests/

      - name: OpenAPI snapshot drift check
        run: |
          python -m app.export_openapi
          git -C .. diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI types drift check
        run: |
          npm run generate:types
          git diff --exit-code src/generated/api-types.ts

      - name: Type-check (tsc)
        run: npx tsc -b

      - name: Test (vitest)
        run: npm test

      - name: Build (production)
        run: npm run build
