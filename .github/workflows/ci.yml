name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        # The sibling delivery-workflow package first (editable, src layout) —
        # it is NOT on PyPI and deliberately not a bare dev requirement, so it
        # must be installed explicitly for `import delivery_workflow` to
        # resolve without any sys.path shim (R10a).
        run: |
          pip install -e ../packages/delivery-workflow
          pip install -e ".[dev]" ruff mypy

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type-check (mypy)
        run: mypy app/

      - name: Test (pytest + coverage)
        run: pytest tests/

      - name: OpenAPI snapshot drift check
        run: |
          python -m app.export_openapi
          git -C .. diff --exit-code frontend/openapi.json

  delivery-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/delivery-workflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev + runtime deps)
        run: pip install -e ".[dev]"

      - name: Import boundary (import-linter, .importlinter contract)
        run: lint-imports

      - name: Test (pytest) — portable delivery-workflow suite
        run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI types drift check
        run: |
          npm run generate:types
          git diff --exit-code src/generated/api-types.ts

      - name: Type-check (tsc)
        run: npx tsc -b

      - name: Test (vitest)
        run: npm test

      - name: Build (production)
        run: npm run build
